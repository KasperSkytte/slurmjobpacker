<svg xmlns="http://www.w3.org/2000/svg" width="607" height="931" viewBox="0 0 607 931" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Badly and well packed nodes</title><desc>A slim node (64 CPUs, 256 GB) and a fat node (64 CPUs, 1024 GB), drawn with CPUs across and memory up, packed badly and well with the same eleven jobs. Badly packed: a big high-memory job on the slim node uses up its memory, leaving 32 CPUs unavailable; low-memory jobs use up the fat node's CPUs, wasting 648 GB; job J (16 CPUs, 128 GB) cannot run on either node. Jobs are labelled A to K. Well packed: every job runs, J included, the slim node wastes 60 GB, and the fat node keeps 18 CPUs and 466 GB free for more jobs.</desc>
<defs><pattern id="waste" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2c2c2a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6f6e69" stroke-width="1.2"/></pattern></defs>
<rect width="100%" height="100%" rx="8" fill="#1a1a19"/>
<text x="24.0" y="40.0" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start">Badly and well packed nodes, with the same jobs</text>
<rect x="24" y="57" width="12" height="10" rx="2" fill="#3987e5"/>
<text x="42.0" y="66.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Job with a low memory/CPU requirement</text>
<rect x="314.2" y="57" width="12" height="10" rx="2" fill="#d95926"/>
<text x="332.2" y="66.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Job with a high memory/CPU requirement</text>
<rect x="24" y="77" width="12" height="10" rx="2" fill="url(#waste)"/>
<text x="42.0" y="86.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Wasted</text>
<rect x="109.6" y="77" width="12" height="10" rx="2" fill="#252524"/>
<text x="127.6" y="86.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Free</text>
<text x="24.0" y="126.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start">Badly packed</text>
<text x="24.0" y="144.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Job J cannot run: neither node has room for it.</text>
<text x="68.0" y="176.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Waiting in the queue:</text>
<rect x="68.0" y="188.0" width="51.2" height="35.8" rx="1.5" fill="#d95926"/>
<text x="127.2" y="209.9" fill="#ffffff" font-size="11" font-weight="600" text-anchor="start">J: 16 CPUs, 128 GB</text>
<rect x="170.4" y="381.0" width="102.4" height="71.7" fill="url(#waste)"/>
<rect x="181.5" y="386.3" width="80.2" height="61.2" rx="3" fill="#1a1a19" fill-opacity="0.92"/>
<text x="221.6" y="399.3" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle">Unavailable</text>
<text x="221.6" y="413.6" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle">CPUs due to</text>
<text x="221.6" y="427.9" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle">memory</text>
<text x="221.6" y="442.2" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle">starvation</text>
<rect x="68.5" y="408.4" width="24.6" height="43.8" rx="1.5" fill="#d95926"/>
