<text x="312.8" y="309.4" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 312.8 309.4)">Memory (GB)</text>
<text x="447.2" y="484.7" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="middle">fat node</text>
<text x="24.0" y="536.7" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start">Well packed</text>
<text x="24.0" y="554.7" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Every job runs, J included, with room for more jobs.</text>
<rect x="68.0" y="791.8" width="204.8" height="16.8" fill="url(#waste)"/>
<rect x="101.6" y="791.0" width="137.6" height="18.3" rx="3" fill="#1a1a19" fill-opacity="0.92"/>
