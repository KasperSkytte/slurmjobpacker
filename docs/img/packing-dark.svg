<text x="447.2" y="274.9" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle">needed</text>
<rect x="345.3" y="444.3" width="50.2" height="8.0" rx="1.5" fill="#3987e5"/>
<text x="370.4" y="440.8" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">B</text>
