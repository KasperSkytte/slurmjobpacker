<text x="340.8" y="174.0" fill="#898781" font-size="10" font-weight="400" text-anchor="end">1024</text>
<text x="312.8" y="309.4" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 312.8 309.4)">Memory (GB)</text>
<text x="447.2" y="484.7" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="middle">fat node</text>
<text x="644.8" y="126.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start">Well packed</text>
<text x="644.8" y="144.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Every job runs, J too, and the new job fits on the fat node.</text>
