<text x="154.4" y="379.7" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">H</text>
<rect x="68.0" y="381.0" width="204.8" height="71.7" fill="none" stroke="#383835" stroke-width="1"/>
