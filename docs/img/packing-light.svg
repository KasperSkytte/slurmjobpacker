<svg xmlns="http://www.w3.org/2000/svg" width="920" height="444" viewBox="0 0 920 444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Packing jobs on shared nodes</title><desc>Two panels of two nodes each, drawn with CPUs on the x axis and memory on the y axis. Left: jobs placed wherever there is room; the fat node's CPUs fill with light jobs and the slim node's memory with a heavy one, so a waiting job fits on neither although 68 CPUs and 584 GB are free. Right: jobs placed by the free CPU and memory on each node, each job where its shape matches what is idle; the waiting job fits on either node.</desc>
<rect width="100%" height="100%" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="40.0" fill="#0b0b0b" font-size="16" font-weight="600" text-anchor="start">The same jobs on two nodes (CPUs across, memory up)</text>
<rect x="24" y="57" width="12" height="10" rx="2" fill="#2a78d6"/>
<text x="42.0" y="66.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">light job, 2 GB/CPU</text>
<rect x="224" y="57" width="12" height="10" rx="2" fill="#eb6834"/>
<text x="242.0" y="66.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">heavy job, 50 GB/CPU</text>
<rect x="424" y="57" width="12" height="10" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="442.0" y="66.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">waiting job, 8 GB/CPU</text>
<text x="24.0" y="104.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="start">Placed wherever there is room</text>
<rect x="56.4" y="314.3" width="156.0" height="13.4" fill="#f0efec"/>
<rect x="46.5" y="328.3" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="46.0" y="314.3" width="166.4" height="61.4" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="129.2" y="391.8" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">64 CPUs</text>
<text x="38.0" y="345.0" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 38.0 345.0)">256 GB</text>
<rect x="56.4" y="297.0" width="41.6" height="30.7" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="129.2" y="411.8" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">slim node: does not fit</text>
<rect x="428.0" y="130.0" width="20.8" height="126.7" fill="#f0efec"/>
<rect x="282.9" y="370.5" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="314.1" y="364.7" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="345.3" y="359.0" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="376.5" y="353.2" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="407.7" y="305.2" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="418.1" y="257.2" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="282.4" y="130.0" width="166.4" height="245.8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="365.6" y="391.8" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">64 CPUs</text>
<text x="274.4" y="252.9" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 274.4 252.9)">1024 GB</text>
<rect x="428.0" y="226.0" width="41.6" height="30.7" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="365.6" y="411.8" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">fat node: does not fit</text>
<text x="472.0" y="104.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="start">Placed where each job matches what is idle</text>
<rect x="618.8" y="314.3" width="41.6" height="38.4" fill="#f0efec"/>
<rect x="494.5" y="370.5" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="525.7" y="364.7" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="556.9" y="359.0" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="588.1" y="353.2" width="30.2" height="4.8" rx="1.5" fill="#2a78d6"/>
<rect x="494.0" y="314.3" width="166.4" height="61.4" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="577.2" y="391.8" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">64 CPUs</text>
<text x="486.0" y="345.0" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 486.0 345.0)">256 GB</text>
<rect x="618.8" y="322.0" width="41.6" height="30.7" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="577.2" y="411.8" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">slim node: fits</text>
<rect x="761.6" y="130.0" width="135.2" height="101.8" fill="#f0efec"/>
<rect x="730.9" y="328.3" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="741.3" y="280.3" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="751.7" y="232.3" width="9.4" height="47.0" rx="1.5" fill="#eb6834"/>
<rect x="730.4" y="130.0" width="166.4" height="245.8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="813.6" y="391.8" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">64 CPUs</text>
<text x="722.4" y="252.9" fill="#898781" font-size="11" text-anchor="middle" transform="rotate(-90 722.4 252.9)">1024 GB</text>
<rect x="761.6" y="201.0" width="41.6" height="30.7" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="813.6" y="411.8" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">fat node: fits</text>
</svg>
