---
- name: Write sjp.toml
  ansible.builtin.template:
    src: sjp.toml.j2
    dest: "{{ sjp_config_dir }}/sjp.toml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart sjpd

- name: Install the sjpd systemd unit
  ansible.builtin.template:
    src: sjpd.service.j2
    dest: /etc/systemd/system/sjpd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart sjpd

- name: Enable and start sjpd
  ansible.builtin.systemd:
    name: sjpd
    enabled: "{{ sjp_service_enabled }}"
    state: "{{ sjp_service_state }}"
    daemon_reload: true

- name: Install the sjp-viz systemd unit
  ansible.builtin.template:
    src: sjp-viz.service.j2
    dest: /etc/systemd/system/sjp-viz.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart sjp-viz
  when: sjp_viz_enabled | bool

- name: Enable and start sjp-viz
  ansible.builtin.systemd:
    name: sjp-viz
    enabled: true
    state: started
    daemon_reload: true
  when: sjp_viz_enabled | bool

- name: Stop and disable sjp-viz, if it was installed
  ansible.builtin.systemd:
    name: sjp-viz
    enabled: false
    state: stopped
  failed_when: false
  when: not sjp_viz_enabled | bool
