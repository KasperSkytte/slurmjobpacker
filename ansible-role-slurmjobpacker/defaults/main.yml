---
# Where the checkout goes. Install it on every slurmctld host, so whichever
# controller is active can load lua/sjp.lua from job_submit.lua.
sjp_repo: https://github.com/KasperSkytte/slurmjobpacker.git
sjp_version: v1.11.1  # x-release-please-version
sjp_install_dir: /opt/slurmjobpacker
sjp_python: /usr/bin/python3

# sjpd runs on one host only: two would both change the QOS caps and release
# pins. On the other controllers sjp.place() finds no table and returns false.
sjp_daemon_host: "{{ ansible_play_hosts_all[0] }}"
# The user sjpd runs as. In advise and enforce it changes jobs and QOS caps, so
# it must be a Slurm operator or administrator (sacctmgr modify user ... adminlevel=).
sjp_user: slurm

# sjp.toml, as {section: {key: value}}; a dict value becomes a sub-table. Only
# what differs from sjp's defaults is needed; to list them all:
#   python3 -m sjp.daemon --print-config
# Partitions, their PriorityTier and the QOS caps are read from Slurm.
sjp_config_dir: /etc/sjp
sjp_config:
  general:
    mode: observe                  # observe -> advise -> enforce
  limits:
    mode: "off"                    # off | global | flex: help jobs held by QOS CPU caps
    flex_qos_name: flex            # for flex: create this QOS and allow it for all users,
                                   # e.g. sacctmgr -i modify account root set qos+=flex
    min_idle_share: 0.25           # act only while at least this share of the cluster is idle
  pin:
    time_aware: false              # true: weigh time limits when choosing a node

sjp_service_enabled: true
sjp_service_state: started

# true creates the disable file: sjp.place() then returns false, so only the
# rules in your job_submit.lua apply.
sjp_disabled: false

# slurm.conf on the controllers. The role checks it has JobSubmitPlugins=lua:
# a warning in observe mode, an error in advise and enforce, where sjp has no
# effect without it. Slurm reads job_submit.lua from the same directory.
sjp_slurm_conf: /etc/slurm/slurm.conf

# Install the example job_submit.lua (templates/job_submit.lua.j2) next to
# slurm.conf. Leave false if you have your own; add the sjp.place() call to it.
# When true, an existing job_submit.lua is backed up before it is replaced.
sjp_job_submit_install: false
sjp_interactive_partition: interactive   # for salloc/srun, if it exists; "" leaves them alone
sjp_interactive_qos: ""                  # QOS for them too; "" keeps theirs
sjp_gpu_partition: ""                    # for GPU jobs, e.g. "gpu"; "" leaves them alone
# Fallback when sjp does not place a batch job: SLIM below FAT_ABOVE MB of
# memory per CPU, FAT from it. "" for either leaves the job as submitted.
sjp_fallback_slim: ""                    # e.g. "slim1,slim2"
sjp_fallback_fat: ""                     # e.g. "fat1,fat2"
sjp_fallback_fat_above: 6000
# Log each job's shape (CPUs, memory, memory per CPU) and its node's free space
# in the slurmctld log, not only where it went.
sjp_verbose_log: false

# Run `scontrol reconfigure` when a new version is checked out, so slurmctld
# loads the new sjp.lua. Needed once job_submit.lua calls sjp.
sjp_reconfigure_slurm: "{{ sjp_job_submit_install }}"

# The live 3D view of the cluster (python3 -m sjp.viz), as a service next to
# sjpd. It answers only on sjp_viz_bind; the page shows users and job names.
sjp_viz_enabled: false
sjp_viz_bind: 127.0.0.1
sjp_viz_port: 8650
