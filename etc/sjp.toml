# slurmjobpacker configuration.
# Every tunable the daemon has. Values shown are the built-in defaults;
# regenerate with:  python3 -m sjp.daemon --print-config
#
# Start in mode = "observe": the daemon computes and logs every decision and
# changes nothing. "advise" lets the plugin choose partitions; "enforce" also
# pins nodes, widens long waits and, with [limits] mode set, helps jobs held by
# QOS CPU caps. While disable_file exists, sjp.place() returns false, so only
# the site's own rules in job_submit.lua apply.

[general]
mode = "observe"
state_dir = "/run/sjp"
log_file = "/var/log/sjp/decisions.jsonl"
text_log = "/var/log/sjp/sjp.log"
disable_file = "/etc/sjp/disable"

[cadence]
score_interval = 1.0
node_poll_interval = 1.0
queue_poll_interval = 8.0
act_interval = 15.0
policy_max_age = 300.0

[topology]
batch_partitions = []
exclude_partitions = []
exclude_interactive = true
exclude_gpu_nodes = true

[policy]
demand = [[800, 0.1], [1280, 0.15], [4267, 0.25], [7680, 0.25], [14178, 0.15], [30720, 0.1]]
demand_median = 4267
tolerance = 0.25
always_place = false

[policy.buckets]
mem_per_cpu = [1024, 2048, 4096, 6144, 8192, 12288, 24576]
cpus = [1, 4, 8, 16, 32, 64, 128]
walltime_h = [1, 6, 24, 72]

[pin]
enabled = true
min_gain = 1.0
min_ratio_gain = 0.1
release_after = 60.0
max_age = 10.0
time_aware = false
wait_for_room = false

[starvation]
enabled = true

[starvation.budget_hours]
fat = 1.0
slim = 4.0
fat_ratio_threshold = 6000

[recheck]
interval = 60.0

[limits]
mode = "off"
state_file = "/var/lib/sjp/limits.json"
ceiling = 2.0
min_idle_share = 0.25
lower_below = 0.1
hysteresis = 5
pulse_seconds = 60.0
cooldown_seconds = 300.0
flex_qos_name = "flex"
flex_revert_after = 60.0

