<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slurmjobpacker</title>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(22, 27, 34, 0.86); --text: #e6edf3; --muted: #8b949e;
    --line: #30363d; --accent: #58a6ff; --free: #3fb950;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(4px); }
  #head { top: 16px; left: 16px; max-width: 420px; }
  #head h1 { margin: 0 0 2px; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  #head h1 a { color: inherit; text-decoration: none; }
  #head h1 a:hover { text-decoration: underline; }
  #head .sub { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px;
    margin-top: 10px; align-items: center; font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  #legend { bottom: 16px; left: 16px; font-size: 12px; color: var(--muted); }
  #legend .ramp { width: 220px; height: 10px; border-radius: 5px; margin: 6px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; width: 220px; }
  #legend { cursor: pointer; user-select: none; }
  #legend .hint { margin-top: 4px; font-size: 11px; color: var(--muted); opacity: .8; }
  #info { top: 16px; right: 16px; width: 260px; display: none; font-size: 13px; }
  #info h2 { margin: 0 0 8px; font-size: 16px; }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { padding: 2px 0; vertical-align: top; overflow-wrap: anywhere; }
  #info td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  #info .close { position: absolute; top: 8px; right: 10px; cursor: pointer; color: var(--muted); }
  #help { bottom: 16px; right: 16px; font-size: 12px; color: var(--muted); }
  #err { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
  body.clean #help, body.clean #info, body.clean .switch { display: none !important; }
  body.bare .panel { display: none !important; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="head" class="panel">
  <h1><a id="title" href="https://github.com/KasperSkytte/slurmjobpacker" target="_blank" rel="noopener">slurmjobpacker</a></h1>
  <div class="sub" id="subtitle">Live view of the cluster in CPUs × memory × time space.</div>
  <div class="stats">
    <span>CPUs</span><div class="bar"><i id="cpubar"></i></div><span id="cpu">–</span>
    <span>Memory</span><div class="bar"><i id="membar"></i></div><span id="mem">–</span>
    <span>Jobs</span><span id="jobs" style="grid-column: span 2">–</span>
    <span>Time</span><span id="clock" style="grid-column: span 2">–</span>
  </div>
  <div class="sub switch" style="margin-top:8px"><a id="to2d" href="2d" style="color:var(--accent);text-decoration:none">2D view</a></div>
</div>
<div id="legend" class="panel" title="Click or press C to switch the colour scale">
  <span id="legend-title">Memory per CPU of each job (GB/C)</span>
  <div class="ramp" id="ramp"></div>
  <div class="ticks" id="ticks"></div>
  <div class="hint">click or <b>C</b>: switch scale</div>
</div>
<div id="info" class="panel"><span class="close" id="close">✕</span><h2 id="info-title"></h2><table id="info-body"></table></div>
<div id="help" class="panel">drag to turn · right-drag or <b>Ctrl</b>+drag to move · scroll to zoom · click a job · <b>R</b> rotate · <b>L</b> labels · <b>C</b> colours · <b>H</b> hide panels</div>
<div id="err" class="panel"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const params = new URLSearchParams(location.search);
if (params.get("clean") === "1") document.body.classList.add("clean");
document.getElementById("to2d").href = "2d" + location.search;
// ?ui=1.6 makes the text panels bigger, for small screens.
const ui = parseFloat(params.get("ui") || "1");
if (ui !== 1) for (const p of document.querySelectorAll(".panel")) p.style.zoom = ui;
if (params.get("title")) document.getElementById("title").textContent = params.get("title");
if (params.get("subtitle")) document.getElementById("subtitle").textContent = params.get("subtitle");

// ------------------------------------------------------------------ scales
const NODE_W = 10, NODE_H = 8, NODE_D = 12;        // the biggest node, in scene units
const GAP_X = 3.5, GAP_ROW = 11, QUEUE_Z = 5;
// On tall screens (phones) the rows sit closer, and the queue stands behind them.
const tall = innerWidth / innerHeight < 0.9;
const ROW_GAP = tall ? 4.5 : GAP_ROW;
const QUEUE_BACK = 6;          // on tall screens: how far behind the last row the queue stands,
const QUEUE_UP = NODE_H + 1.5;  // and how high, so it is seen above the nodes
let maxCpus = 1, maxMem = 1, horizon = 14 * 86400;
const sx = c => NODE_W * c / maxCpus;
const sy = m => NODE_H * m / maxMem;
// Time runs away from the viewer (along -z) on a square-root scale, so an hour
// and two weeks both stay visible. The front face of a node is "now".
const sz = t => NODE_D * Math.sqrt(Math.max(0, Math.min(t, horizon)) / horizon);

// Memory in GB, and memory per CPU in GB/C; one decimal below 10.
const num = mb => mb >= 10240 ? (mb / 1024).toFixed(0) : (mb / 1024).toFixed(1);
const gb = mb => num(mb) + " GB";
const gbc = mb => num(mb) + " GB/C";
const cpus = n => Math.round(n) + (Math.round(n) === 1 ? " CPU" : " CPUs");
const dur = s => s >= 86400 ? (s / 86400).toFixed(s >= 864000 ? 0 : 1) + " d"
              : s >= 3600 ? (s / 3600).toFixed(s >= 36000 ? 0 : 1) + " h"
              : Math.max(0, Math.round(s / 60)) + " min";

// Two colour scales, switched with C or a click on the legend:
//  fit (default): memory per CPU against the node's, green when equal, blue below,
//  red above (1/4x to 4x); waiting jobs, which have no node yet, are grey;
//  memory per CPU (?color=mpc to start so): 1 GB blue to 32 GB orange, log scale.
let colorMode = params.get("color") === "mpc" ? "mpc" : "fit";
function hueOf(mpc, nodeMpc) {
  if (colorMode === "mpc") {
    const t = Math.max(0, Math.min(1, Math.log2(Math.max(mpc, 1024) / 1024) / 5));
    return 205 - 190 * t;
  }
  if (!nodeMpc) return null;
  const t = Math.max(-1, Math.min(1, Math.log2(mpc / nodeMpc) / 2));
  return t >= 0 ? 130 - 125 * t : 130 - 80 * t;
}
const SCALES = {
  mpc: { title: "Memory per CPU of each job (GB/C)", stops: [0, .2, .4, .6, .8, 1].map(t => [1024 * 2 ** (5 * t), 1]),
         ticks: ["1", "2", "4", "8", "16", "32+"] },
  fit: { title: "Job's memory per CPU vs its node's", stops: [-1, -.5, 0, .5, 1].map(t => [2 ** (2 * t), 1]),
         ticks: ["¼×", "½×", "1×", "2×", "4×"] },
};
function drawLegend() {
  const sc = SCALES[colorMode];
  document.getElementById("legend-title").textContent = sc.title;
  document.getElementById("ramp").style.background = "linear-gradient(90deg," +
    sc.stops.map(([m, n]) => `hsl(${hueOf(m, n)}, 62%, 52%)`).join(",") + ")";
  document.getElementById("ticks").innerHTML = sc.ticks.map(t => `<span>${t}</span>`).join("");
}
function switchScale() { colorMode = colorMode === "mpc" ? "fit" : "mpc"; drawLegend(); recolor(); }
document.getElementById("legend").addEventListener("click", switchScale);
addEventListener("keydown", e => { if (e.key === "c" || e.key === "C") switchScale(); });
drawLegend();
const nodeMpc = {};                // node name -> its memory per CPU
function jobColor(job) {
  const h = hueOf(job.mem / Math.max(job.cpus, 1e-9), job.node && nodeMpc[job.node]);
  const c = new THREE.Color();
  return h === null ? c.setHSL(0, 0, 0.45) : c.setHSL(h / 360, 0.62, 0.52);
}
function recolor() {
  for (const v of views.values()) for (const m of [v.mesh, v.fill]) m.material.color.copy(jobColor(v.job));
}

// ------------------------------------------------------------------ scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 160, 320);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 0.6;
controls.autoRotate = params.get("rotate") === "1";
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1f29, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(30, 50, 40); scene.add(sun);
const world = new THREE.Group(); scene.add(world);

function textSprite(lines, { size = 48, color = "#e6edf3", sub = "#8b949e", colors = [] } = {}) {
  // The canvas is as wide as the text, so a sprite anchored by its right or
  // centre lines up with its text.
  const c = document.createElement("canvas"), g = c.getContext("2d");
  const font = i => `${i ? 400 : 650} ${i ? size * 0.8 : size}px system-ui, sans-serif`;
  const width = Math.max(...lines.map((l, i) => { g.font = font(i); return g.measureText(l).width; }));
  c.width = Math.ceil(width + 8); c.height = Math.ceil(size * 1.35 * lines.length + 16);
  g.textBaseline = "top";
  lines.forEach((l, i) => {
    g.font = font(i); g.fillStyle = colors[i] || (i ? sub : color); g.fillText(l, 4, 8 + i * size * 1.35);
  });
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const h = 1.5 * lines.length * 0.55; s.scale.set(h * c.width / c.height, h, 1);
  s.center.set(0, 0); return s;
}

// A label lying on the front face of a job box: job id, and its memory per CPU.
function faceLabel(top, bottom) {
  const c = document.createElement("canvas"), g = c.getContext("2d");
  c.width = 256; c.height = 128;
  g.textAlign = "center"; g.textBaseline = "middle";
  const fit = (text, weight, size) => {           // shrink the font until it fits
    g.font = `${weight} ${size}px system-ui, sans-serif`;
    while (g.measureText(text).width > 240 && size > 12) g.font = `${weight} ${--size}px system-ui, sans-serif`;
  };
  fit(top, 700, 50); g.fillStyle = "rgba(255,255,255,0.95)"; g.fillText(top, 128, 44);
  fit(bottom, 500, 40); g.fillStyle = "rgba(255,255,255,0.8)"; g.fillText(bottom, 128, 96);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  return m;                               // faces +z, towards the viewer
}

// ------------------------------------------------------------------ nodes
const nodeViews = new Map();   // name -> {group, origin, w, h, free, freeLabel}
let queueLeft = -20, queueWidth = 40, queueBehind = false, sceneDepth = 0, rowEnds = [];
let layoutKey = "";

// Whole-node reservations only: memory cannot be reserved, so part of a node
// has no shape in CPUs x memory. The one in effect first, else the next.
const RESV = 0xa371f7;
// A date and a 24-hour time, with the year only when it is not this year: "Oct 19, 08:00".
const when = t => {
  const d = new Date(t * 1000);
  return d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
    hourCycle: "h23", ...(d.getFullYear() !== new Date().getFullYear() && { year: "numeric" }) });
};
// "Oct 19, 08:00 – Oct 21, 08:00 (2.0 d)"; the end as a time only on the same day
const span = r => {
  const a = new Date(r.start * 1000), b = new Date(r.end * 1000);
  const end = a.toDateString() === b.toDateString()
    ? b.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : when(r.end);
  return `${when(r.start)} – ${end} (${dur(r.end - r.start)})`;
};
function wholeResv(n) {
  const rs = (n.resv || []).filter(r => r.whole).sort((a, b) => b.active - a.active || a.start - b.start);
  return rs[0] || null;
}
const resvLine = r => r ? `reserved: ${r.name}, ${span(r)}` : "";

// A node's name and size; when it takes no jobs, its state (DOWN, DRAIN, ...);
// and a whole-node reservation.
function nodeLabel(n) {
  const lines = [n.name, `${n.cpus} CPUs · ${gb(n.mem)} · ${gbc(n.mem / n.cpus)}`], colors = [];
  if (!n.up) { colors[lines.length] = "#f85149"; lines.push(n.state || "down"); }
  const r = resvLine(wholeResv(n));
  if (r) { colors[lines.length] = "#a371f7"; lines.push(r); }
  const label = textSprite(lines, { colors });
  label.center.set(0, 1); label.position.set(0, -0.75, 1.0);
  return label;
}

// Follow a node coming back, going down or being reserved: the frame red while
// it takes no jobs, purple while all of it is reserved.
function nodeState(nv, n) {
  nv.node = n;
  const held = wholeResv(n);
  nv.held = held && held.active ? held : null;
  nv.frame.material.color.set(!n.up ? 0xf85149 : nv.held ? RESV : 0x6e7681);
  const state = (n.up ? "" : n.state) + "|" + resvLine(held);
  if (state === nv.state) return;
  nv.state = state;
  nv.group.remove(nv.label); nv.label.material.map.dispose(); nv.label.material.dispose();
  nv.label = nodeLabel(n); nv.group.add(nv.label);
}

function layoutNodes(nodes) {
  const key = nodes.map(n => n.name + n.cpus + n.mem).join();
  if (key === layoutKey) return;
  layoutKey = key;
  for (const v of nodeViews.values()) world.remove(v.group);
  nodeViews.clear();
  maxCpus = Math.max(...nodes.map(n => n.cpus), 1);
  maxMem = Math.max(...nodes.map(n => n.mem), 1);
  // One row per partition group, highest PriorityTier nearest the viewer.
  const rows = new Map();
  [...nodes].sort((a, b) => b.tier - a.tier || a.name.localeCompare(b.name, undefined, { numeric: true }))
    .forEach(n => { const k = n.partitions.join(","); if (!rows.has(k)) rows.set(k, []); rows.get(k).push(n); });
  let r = 0, widest = 0;
  rowEnds = [];
  const rowWidths = [...rows.values()].map(ns => ns.reduce((w, n) => w + sx(n.cpus) + GAP_X, -GAP_X));
  widest = Math.max(...rowWidths);
  for (const [part, ns] of rows) {
    let x = -rowWidths[r] / 2;
    const z = -r * (NODE_D + ROW_GAP);
    const holder = new THREE.Group();
    for (const n of ns) {
      const w = sx(n.cpus), h = sy(n.mem), g = new THREE.Group();
      g.position.set(x, 0, z);
      const frame = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, NODE_D)),
        new THREE.LineBasicMaterial({ color: n.up ? 0x6e7681 : 0xf85149, transparent: true, opacity: 0.9 }));
      frame.position.set(w / 2, h / 2, -NODE_D / 2); g.add(frame);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, NODE_D),
        new THREE.MeshBasicMaterial({ color: 0x161b22, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
      floor.rotation.x = -Math.PI / 2; floor.position.set(w / 2, -0.01, -NODE_D / 2); g.add(floor);
      for (const [t, l] of [[3600, "1 h"], [86400, "1 d"], [7 * 86400, "7 d"], [14 * 86400, "14 d"]]) {
        const tick = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
          [new THREE.Vector3(0, 0, -sz(t)), new THREE.Vector3(w, 0, -sz(t))]),
          new THREE.LineBasicMaterial({ color: 0x30363d }));
        g.add(tick);
        const tl = textSprite([l], { size: 40, color: "#6e7681" });
        tl.scale.multiplyScalar(0.6); tl.position.set(w + 0.15, 0.02, -sz(t)); g.add(tl);
      }
      const label = nodeLabel(n); g.add(label);
      // Units on every axis: CPUs along the front edge, memory up the left one.
      const axisText = (txt, x, y, z, cx, cy) => {
        const t = textSprite([txt], { size: 40, color: "#6e7681" });
        t.scale.multiplyScalar(0.6); t.center.set(cx, cy); t.position.set(x, y, z); g.add(t);
      };
      const edge = pts => g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x6e7681 })));
      for (const f of [0.5, 1]) {
        edge([new THREE.Vector3(w * f, 0, 0.05), new THREE.Vector3(w * f, -0.18, 0.05)]);
        axisText(f === 1 ? `${n.cpus} CPUs` : `${Math.round(n.cpus / 2)}`, w * f, -0.2, 0.05, 0.5, 1);
        edge([new THREE.Vector3(0, h * f, 0.05), new THREE.Vector3(-0.18, h * f, 0.05)]);
        axisText(f === 1 ? gb(n.mem) : num(n.mem / 2), -0.25, h * f, 0.05, 1, 0.5);
      }
      // The node's own memory per CPU: a dashed diagonal across its front face.
      // Jobs are stacked corner to corner, so a stack that follows this line
      // uses CPUs and memory at the rate the node has them.
      const diag = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(0, 0, 0.03), new THREE.Vector3(w, h, 0.03)]),
        new THREE.LineDashedMaterial({ color: 0xc9d1d9, dashSize: 0.25, gapSize: 0.18,
                                       transparent: true, opacity: 0.55 }));
      diag.computeLineDistances(); g.add(diag);
      // A node running nothing at all says so, in the middle of its box.
      const idle = textSprite(["idle"], { size: 72, color: "#3fb950" });
      idle.scale.multiplyScalar(Math.min(2.6, w / idle.scale.x * 0.6));
      idle.center.set(0.5, 0.5); idle.position.set(w / 2, h / 2, -NODE_D / 2); idle.visible = false;
      g.add(idle);
      const tAxis = textSprite(["time →"], { size: 40, color: "#6e7681" });
      tAxis.scale.multiplyScalar(0.6); tAxis.position.set(w + 0.15, 0.02, -NODE_D * 0.5); g.add(tAxis);
      const free = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshBasicMaterial({ color: 0x3fb950, transparent: true, opacity: 0.16, depthWrite: false }));
      g.add(free);
      const freeEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
        new THREE.LineBasicMaterial({ color: 0x3fb950, transparent: true, opacity: 0.6 }));
      g.add(freeEdge);
      const freeLabel = faceLabel("room", ""); g.add(freeLabel);
      // Taken: from no CPUs and no memory to what the jobs use of each, red at
      // the front as the free box is green.
      const taken = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshBasicMaterial({ color: 0xf85149, transparent: true, opacity: 0.16, depthWrite: false }));
      taken.visible = false; g.add(taken);
      holder.add(g);
      nodeViews.set(n.name, { group: g, w, h, node: n, free, freeEdge, freeLabel, freeKey: "", taken,
                              frame, label, state: null,
                              used: [0, 0], idle, floor });
      x += w + GAP_X;
    }
    const rowLabel = textSprite([part], { size: 64, color: "#8b949e" });
    rowLabel.center.set(0, 0.5); rowLabel.position.set(x - GAP_X + 1.6, 0.3, z - NODE_D / 2);
    holder.add(rowLabel);
    rowEnds.push([x - GAP_X, z]);
    world.add(holder); nodeViews.get(ns[0].name).holder = holder;
    r++;
  }
  const depth = rows.size * (NODE_D + ROW_GAP);
  // On a wide screen the waiting jobs stand in a column beside the nodes; on a
  // tall one behind them, at the top of the screen, from where they drop in.
  queueBehind = tall;
  sceneDepth = depth;
  if (queueBehind) { queueWidth = widest; queueLeft = -widest / 2; }
  else { queueWidth = NODE_W * 1.1; queueLeft = -widest / 2 - 5.5 - queueWidth; }
  if (!camera.userData.placed) {
    // Fit the whole scene, queue included: look at its middle from the front
    // and above, and move back until every corner of it is on screen.
    const back = queueBehind ? depth + QUEUE_BACK + NODE_D * 0.8 : depth;
    const box = new THREE.Box3(new THREE.Vector3(queueLeft, -1.5, -back),
                               new THREE.Vector3(widest / 2 + 2, queueBehind ? QUEUE_UP + 4 : NODE_H + 1, 2));
    const centre = box.getCenter(new THREE.Vector3());
    const dir = new THREE.Vector3(queueBehind ? 0.15 : 0.25, 0.55, 0.82).normalize();
    // The corners that matter: every node's box (and its label below it), and the
    // queue's area; not the empty corners of a box around all of them.
    const corners = [];
    const addBox = (x0, x1, y0, y1, z0, z1) => {
      for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1])
        corners.push(new THREE.Vector3(x, y, z));
    };
    for (const nv of nodeViews.values()) {
      const o = nv.group.position, holder = nv.group.parent ? nv.group.parent.position : { x: 0, y: 0, z: 0 };
      const x = o.x + holder.x, z = o.z + holder.z;
      addBox(x, x + nv.w, -1.4, nv.h, z - NODE_D, z + 1.2);
    }
    for (const [x, z] of rowEnds) addBox(x + 1.6, x + 6, 0, 1, z - NODE_D / 2 - 1, z - NODE_D / 2 + 1);
    if (queueBehind) addBox(queueLeft, queueLeft + queueWidth, QUEUE_UP, QUEUE_UP + 3,
                            -depth - QUEUE_BACK - NODE_D * 0.6, -depth - QUEUE_BACK + 1);
    else addBox(queueLeft, queueLeft + queueWidth, -1.4, 3, -NODE_D, 1.2);
    const fits = d => {
      camera.position.copy(centre).addScaledVector(dir, d); camera.lookAt(centre);
      camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      return corners.every(c => { const p = c.clone().project(camera);
        return Math.abs(p.x) < 0.92 && p.y < 0.62 && p.y > -0.8; });  // room for the panels
    };
    let lo = 1, hi = 1000;
    while (hi - lo > 0.5) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
    controls.target.copy(centre); fits(hi);
    camera.userData.placed = true;
  }
}

// ------------------------------------------------------------------ jobs
const views = new Map();       // key -> {mesh, label, target{pos,scale}, job, dying}
const unit = new THREE.BoxGeometry(1, 1, 1);
let showLabels = params.get("labels") !== "0";

// A job is a box as deep as its time limit, filled up to how long it has run;
// a line marks where it is now.
const nowRing = new THREE.BufferGeometry().setFromPoints(
  [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]].map(([x, y]) => new THREE.Vector3(x, y, 0)));
function jobView(key, job, from) {
  const mpc = job.mem / Math.max(job.cpus, 1e-9);
  const material = o => new THREE.MeshStandardMaterial({ color: jobColor(job), roughness: 0.55,
    metalness: 0.05, transparent: true, opacity: o, depthWrite: o > 0.5,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });   // lines on faces win
  const mesh = new THREE.Mesh(unit, material(0.35));
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(unit),
    new THREE.LineBasicMaterial({ color: 0x0d1117, transparent: true, opacity: 0.55 }));
  const fill = new THREE.Mesh(unit, material(0.94));
  const line = new THREE.LineLoop(nowRing, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true }));
  mesh.add(edges, fill, line);
  const label = faceLabel(job.id, gbc(mpc));
  world.add(mesh); world.add(label);
  const v = { key, mesh, fill, line, label, job, dying: false, opacity: 0, ran: 1, tran: 1,
    pos: from ? from.clone() : new THREE.Vector3(), scale: new THREE.Vector3(0.01, 0.01, 0.01),
    tpos: new THREE.Vector3(), tscale: new THREE.Vector3(1, 1, 1) };
  mesh.userData.view = v;
  views.set(key, v);
  return v;
}

function place(v, x, y, z, w, h, d) {
  v.tpos.set(x + w / 2, y + h / 2, z + d / 2);
  v.tscale.set(Math.max(w, 0.02), Math.max(h, 0.02), Math.max(d, 0.02));
}

let state = null;
let queueLabel = textSprite(["Waiting"], { size: 64 }), queueText = "Waiting"; world.add(queueLabel);
queueLabel.material.depthTest = false; queueLabel.renderOrder = 1;
// "Waiting", or which part of a longer queue is shown.
const waitingTitle = s => s.pending_total > s.pending.length
  ? `Waiting (top ${s.pending.length} by priority)` : "Waiting";
function apply(s) {
  state = s; horizon = s.horizon || horizon;
  for (const n of s.nodes) nodeMpc[n.name] = n.mem / n.cpus;
  layoutNodes(s.nodes);
  const seen = new Set();
  // Running jobs: per node, stacked corner to corner in the order they
  // started, so the stack ends where the node's free space begins.
  const byNode = new Map();
  for (const j of s.running) { if (!byNode.has(j.node)) byNode.set(j.node, []); byNode.get(j.node).push(j); }
  const fresh = new Map(s.nodes.map(n => [n.name, n]));
  for (const [name, nv] of nodeViews) {
    if (fresh.has(name)) nodeState(nv, fresh.get(name));
    const js = (byNode.get(name) || []).sort((a, b) => (+a.id || 0) - (+b.id || 0) || String(a.id).localeCompare(String(b.id)));
    let cx = 0, cy = 0;
    for (const j of js) {
      const key = "r:" + j.id + "@" + name;
      seen.add(key);
      let v = views.get(key);
      if (!v) {
        const q = views.get("q:" + j.id);
        const from = q ? q.pos.clone() : nv.group.getWorldPosition(new THREE.Vector3())
          .add(new THREE.Vector3(sx(cx), NODE_H + 6, 0));
        v = jobView(key, j, from);
        if (q) { q.dying = true; q.instant = true; }
      }
      v.job = j;
      const w = sx(j.cpus), h = sy(j.mem), d = sz(j.minutes * 60);
      v.tran = Math.min(1, sz(s.now - (j.end - j.minutes * 60)) / Math.max(d, 1e-9));
      if (v.opacity === 0) v.ran = v.tran;           // new: no fill animation
      const o = nv.group.getWorldPosition(new THREE.Vector3());
      place(v, o.x + sx(cx), o.y + sy(cy), o.z - d, w, h, d);
      cx += j.cpus; cy += j.mem;
    }
    nv.used = [cx, cy];
    const tw = sx(cx), th = sy(cy);
    nv.taken.visible = tw > 0.05 && th > 0.05;
    nv.taken.scale.set(Math.max(tw, 1e-3), Math.max(th, 1e-3), 0.12);
    nv.taken.position.set(tw / 2, th / 2, -0.06);
    const isIdle = js.length === 0 && nv.node.up && !nv.held;   // idle, and free for anyone
    nv.idle.visible = isIdle;
    nv.floor.material.color.set(isIdle ? 0x14301c : 0x161b22);
    const fw = sx(Math.max(0, nv.node.cpus - cx)), fh = sy(Math.max(0, nv.node.mem - cy));
    for (const m of [nv.free, nv.freeEdge]) {
      m.material.color.set(nv.held ? RESV : 0x3fb950);    // free, or held by a reservation
      m.visible = fw > 0.05 && fh > 0.05 && nv.node.up;   // a node taking no jobs has no room
      m.scale.set(Math.max(fw, 1e-3), Math.max(fh, 1e-3), 0.12);
      m.position.set(sx(cx) + fw / 2, sy(cy) + fh / 2, -0.06);
    }
    // What still fits: the free CPUs and memory, and their memory per CPU.
    const fc = Math.max(0, nv.node.cpus - cx), fm = Math.max(0, nv.node.mem - cy);
    const fkey = `${Math.round(fc)} ${gb(fm)} ${nv.held ? nv.held.name : ""}`;
    if (fkey !== nv.freeKey) {
      nv.freeKey = fkey;
      const old = nv.freeLabel; nv.group.remove(old); old.material.map.dispose(); old.material.dispose();
      nv.freeLabel = faceLabel(`${cpus(fc)} · ${gb(fm)}`, nv.held ? `reserved: ${nv.held.name}`
                               : fc >= 1 ? `room: ${gbc(fm / fc)}` : "full");
      nv.group.add(nv.freeLabel);
    }
    const ls = Math.min(fw * 0.85, fh * 1.7, 4.5);
    nv.freeLabel.visible = ls > 0.8 && !isIdle && nv.node.up;     // "idle" says it all
    nv.freeLabel.scale.set(ls, ls / 2, 1);
    nv.freeLabel.position.set(sx(cx) + fw / 2, sy(cy) + fh / 2, 0.02);
  }
  // The queue, in front of the nodes, highest priority first.
  let qx = queueLeft, qz = queueBehind ? -sceneDepth - QUEUE_BACK : 0, rowDepth = 0;
  for (const j of s.pending) {
    const key = "q:" + j.id; seen.add(key);
    let v = views.get(key);
    if (!v) v = jobView(key, j, new THREE.Vector3(qx, NODE_H + 4, qz));
    v.job = j;
    const w = sx(j.cpus), h = sy(j.mem), d = sz(j.minutes * 60);
    if (qx + w > queueLeft + queueWidth && qx > queueLeft) { qx = queueLeft; qz -= rowDepth + 0.8; rowDepth = 0; }
    place(v, qx, queueBehind ? QUEUE_UP : 0, qz - d, w, h, d);
    rowDepth = Math.max(rowDepth, d); qx += w + 0.6;
  }
  if (waitingTitle(s) !== queueText) {
    queueText = waitingTitle(s);
    world.remove(queueLabel); queueLabel.material.map.dispose(); queueLabel.material.dispose();
    queueLabel = textSprite([queueText], { size: 64 }); world.add(queueLabel);
    queueLabel.material.depthTest = false; queueLabel.renderOrder = 1;   // never hidden by a box
  }
  queueLabel.center.set(0, 1);
  queueLabel.position.set(queueLeft, queueBehind ? QUEUE_UP - 0.35 : -0.35,
                          queueBehind ? -sceneDepth - QUEUE_BACK + 1 : 1.0);
  queueLabel.visible = s.pending_total > 0;
  for (const [k, v] of views) if (!seen.has(k)) v.dying = true;
  updatePanel(s);
}

function updatePanel(s) {
  const cap = s.nodes.reduce((a, n) => [a[0] + n.cpus, a[1] + n.mem], [0, 0]);
  const use = s.running.reduce((a, j) => [a[0] + j.cpus, a[1] + j.mem], [0, 0]);
  const pc = 100 * use[0] / Math.max(cap[0], 1), pm = 100 * use[1] / Math.max(cap[1], 1);
  document.getElementById("cpubar").style.width = pc + "%";
  document.getElementById("membar").style.width = pm + "%";
  document.getElementById("cpu").textContent = `${Math.round(use[0])} / ${cap[0]} (${pc.toFixed(0)}%)`;
  document.getElementById("mem").textContent = `${gb(use[1])} / ${gb(cap[1])} (${pm.toFixed(0)}%)`;
  const running = new Set(s.running.map(j => j.id)).size;
  document.getElementById("jobs").textContent = `${running} running · ${s.pending_total} waiting`;
  const d = new Date(s.now * 1000);
  document.getElementById("clock").textContent = s.mode === "demo"
    ? `demo, ${Math.round(s.speed)}× real time · ${d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}`
    : d.toLocaleTimeString();
  const err = document.getElementById("err");
  err.style.display = s.error ? "block" : "none"; err.textContent = s.error ? "sjp-viz: " + s.error : "";
}

async function poll() {
  try {
    const r = await fetch("state.json", { cache: "no-store" });
    apply(await r.json());
  } catch (e) {
    const err = document.getElementById("err");
    err.style.display = "block"; err.textContent = "No connection to sjp-viz: " + e.message;
  }
  setTimeout(poll, (state && state.poll_ms) || 3000);
}

// ------------------------------------------------------------------ picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let selected = null, downAt = null;
renderer.domElement.addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([...views.values()].filter(v => !v.dying).map(v => v.mesh), false)[0];
  select(hit ? hit.object.userData.view : null);
});
document.getElementById("close").onclick = () => select(null);

function select(v) {
  if (selected) selected.mesh.children[0].material.color.set(0x0d1117);
  selected = v;
  const box = document.getElementById("info");
  if (!v) { box.style.display = "none"; return; }
  v.mesh.children[0].material.color.set(0xffffff);
  const j = v.job, mpc = j.mem / Math.max(j.cpus, 1e-9), running = v.key.startsWith("r:");
  document.getElementById("info-title").textContent = `Job ${j.id}`;
  const rows = [
    ["User", j.user], ["Name", j.name],
    ["State", running ? `running on ${j.node}` + (j.nodes > 1 ? ` (+${j.nodes - 1} nodes)` : "") : `waiting (${j.reason})`],
    ["CPUs", (+j.cpus).toFixed(j.cpus % 1 ? 1 : 0)], ["Memory", gb(j.mem)], ["Memory / CPU", gbc(mpc)],
    running ? ["Time", `${dur(state.now - j.end + j.minutes * 60)} of ${dur(j.minutes * 60)}, ${dur(j.end - state.now)} left`]
            : ["Time limit", dur(j.minutes * 60)],
    ...(running ? [] : [["Priority", j.priority == null ? "–" : Math.round(j.priority)]]),
    ["Partition", j.partition || "–"], ["QOS", j.qos],
    ...(j.reservation ? [["Reservation", j.reservation]] : []),
    // what sjp did with it, from its AdminComment: one mark per line
    ...(j.sjp ? [["sjp", j.sjp.replace(/^sjp:/, "").split(";").join("\n")]] : []),
  ];
  document.getElementById("info-body").innerHTML = rows.map(([k, val]) =>
    `<tr><td>${k}</td><td>${String(val).replace(/</g, "&lt;").replace(/\n/g, "<br>")}</td></tr>`).join("");
  box.style.display = "block";
}

addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") controls.autoRotate = !controls.autoRotate;
  if (e.key === "l" || e.key === "L") showLabels = !showLabels;
  if (e.key === "h" || e.key === "H") document.body.classList.toggle("bare");
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ------------------------------------------------------------------ animate
let last = performance.now();
function step(dt) {
  const k = 1 - Math.exp(-dt * 5);                  // ease towards the targets
  for (const [key, v] of views) {
    if (v.dying) {
      v.opacity -= v.instant ? 1 : dt * 2.5;
      if (v.opacity <= 0) {
        world.remove(v.mesh); world.remove(v.label);
        v.mesh.material.dispose(); v.fill.material.dispose(); v.line.material.dispose(); v.label.material.map.dispose(); v.label.material.dispose();
        if (selected === v) select(null);
        views.delete(key); continue;
      }
    } else v.opacity = Math.min(1, v.opacity + dt * 3);
    v.pos.lerp(v.tpos, k); v.scale.lerp(v.tscale, k);
    v.mesh.position.copy(v.pos); v.mesh.scale.copy(v.scale);
    v.ran += (v.tran - v.ran) * k;
    v.fill.scale.z = Math.max(v.ran, 1e-3); v.fill.position.z = 0.5 - v.ran / 2;
    v.line.position.z = 0.5 - v.ran;
    v.line.visible = v.ran < 0.995;
    v.mesh.material.opacity = 0.35 * v.opacity;
    v.fill.material.opacity = 0.94 * v.opacity;
    v.line.material.opacity = 0.9 * v.opacity;
    // The label sits on the front face, sized to fit it; on the top face when
    // the front is too low to read (jobs with little memory); hidden if neither fits.
    const fw = v.scale.x, front = Math.min(fw * 0.9, v.scale.y * 1.8),
          top = Math.min(fw * 0.9, v.scale.z * 1.8);
    if (front >= 0.55 || front >= top) {
      v.label.rotation.x = 0;
      v.label.scale.set(front, front / 2, 1);
      v.label.position.set(v.pos.x, v.pos.y, v.pos.z + v.scale.z / 2 + 0.02);
    } else {
      v.label.rotation.x = -Math.PI / 2;
      v.label.scale.set(top, top / 2, 1);
      v.label.position.set(v.pos.x, v.pos.y + v.scale.y / 2 + 0.02, v.pos.z);
    }
    v.label.visible = showLabels && Math.max(front, top) > 0.55 && v.opacity > 0.5;
    v.label.material.opacity = v.opacity;
  }
}
function frame(now) {
  step(Math.min((now - last) / 1000, 0.1)); last = now;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// ?manual=1: no polling and no clock; a recorder feeds states and steps frames.
const manual = params.get("manual") === "1";
if (!manual) { poll(); requestAnimationFrame(frame); }
window.sjpViz = { views, get state() { return state; }, camera, controls, apply,
  frame(dt, orbit = 0) {                 // one recorded frame: dt seconds, orbit radians
    step(dt);
    if (orbit) {
      const off = camera.position.clone().sub(controls.target);
      off.applyAxisAngle(new THREE.Vector3(0, 1, 0), orbit);
      camera.position.copy(controls.target).add(off); camera.lookAt(controls.target);
    }
    controls.update(); renderer.render(scene, camera);
  } };
</script>
</body>
</html>
