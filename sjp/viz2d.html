<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slurmjobpacker</title>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(22, 27, 34, 0.9); --text: #e6edf3; --muted: #8b949e;
    --line: #30363d; --accent: #58a6ff;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
  canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; }
  #head { top: 16px; left: 16px; max-width: 420px; }
  #head h1 { margin: 0 0 2px; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  #head h1 a { color: inherit; text-decoration: none; }
  #head h1 a:hover { text-decoration: underline; }
  #version { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
  #head .sub { color: var(--muted); font-size: 13px; }
  #head a { color: var(--accent); text-decoration: none; }
  .stats { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px;
    margin-top: 10px; align-items: center; font-size: 13px; }
  .filters { display: flex; gap: 6px; }
  .filters select { background: var(--line); color: var(--text); border: 1px solid #484f58;
    border-radius: 6px; padding: 1px 4px; font: inherit; font-size: 12px; max-width: 160px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  #legend { position: fixed; bottom: 16px; left: 16px; font-size: 12px; color: var(--muted); }
  #legend .ramp { width: 220px; height: 10px; border-radius: 5px; margin: 6px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; width: 220px; }
  #legend { cursor: pointer; user-select: none; }
  #legend .hint { margin-top: 4px; font-size: 11px; color: var(--muted); opacity: .8; }
  #info { position: fixed; top: 16px; right: 16px; width: 260px; display: none; font-size: 13px; }
  #info h2 { margin: 0 0 8px; font-size: 16px; }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { padding: 2px 0; vertical-align: top; overflow-wrap: anywhere; }
  #info td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  #info a { color: #a371f7; }
  #info .close { position: absolute; top: 8px; right: 10px; cursor: pointer; color: var(--muted); }
  #help { position: fixed; bottom: 16px; right: 16px; font-size: 12px; color: var(--muted);
    padding: 8px 12px; cursor: pointer; user-select: none; }
  #opt-head { color: var(--text); }
  #opt-head::after { content: " ▸"; color: var(--muted); }
  body.keys #opt-head::after { content: " ▾"; }
  #keys { display: none; border-collapse: collapse; margin-top: 6px; }
  body.keys #keys { display: table; }
  #keys td { padding: 2px 0; vertical-align: middle; }
  #keys tr.opt { cursor: pointer; color: var(--text); }
  #keys tr.opt:hover td { color: #fff; }
  #keys td.k { padding-left: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  #keys tr.how td:nth-child(2) { padding-top: 3px; }
  .sw { display: inline-block; width: 26px; height: 14px; margin-right: 8px; border-radius: 7px;
    background: var(--line); position: relative; vertical-align: middle; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--muted); transition: left .2s, background .2s; }
  .sw.on { background: #1f6feb; }
  .sw.on::after { left: 14px; background: #fff; }
  #busy-legend { display: none; margin-top: 10px; }
  body.busy #busy-legend { display: block; }
  body.clean #help { display: none !important; }
  #err { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
  body.clean #info, body.clean .switch { display: none !important; }
  body.bare .panel { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="head" class="panel">
  <h1><a id="title" href="https://github.com/KasperSkytte/slurmjobpacker" target="_blank" rel="noopener">slurmjobpacker</a><span id="version"></span></h1>
  <div class="sub" id="subtitle">Memory per CPU of every job, live. A slanted band: the job's memory per CPU differs significantly from its node's.</div>
  <div class="stats">
    <span>CPUs</span><div class="bar"><i id="cpubar"></i></div><span id="cpu">–</span>
    <span>Memory</span><div class="bar"><i id="membar"></i></div><span id="mem">–</span>
    <span>Jobs</span><span id="jobs" style="grid-column: span 2">–</span>
    <span>Time</span><span id="clock" style="grid-column: span 2">–</span>
    <span>Show</span><span class="filters" style="grid-column: span 2"><select id="f-user" title="Only this user's jobs"><option value="">all users</option></select><select id="f-account" title="Only this account's jobs"><option value="">all accounts</option></select></span>
  </div>
  <div class="sub switch" style="margin-top:8px"><a id="to3d" href="./">3D view</a></div>
</div>
<div id="legend" class="panel" title="Click or press C to switch the colour scale">
  <span id="legend-title">Memory per CPU of each job (GB/C)</span>
  <div class="ramp" id="ramp"></div>
  <div class="ticks" id="ticks"></div>
  <div class="hint">click to switch scale</div>
  <div id="busy-legend">Node: CPUs allocated
    <div class="ramp" id="busy-ramp"></div>
    <div class="ticks"><span>idle</span><span>50%</span><span>full</span></div>
  </div>
</div>
<div id="help" class="panel"><div id="opt-head" title="Click, or press ?, to open or close">options</div><table id="keys"></table></div>
<div id="info" class="panel"><span class="close" id="close">✕</span><h2 id="info-title"></h2><table id="info-body"></table></div>
<div id="err" class="panel"></div>

<script>
const params = new URLSearchParams(location.search);
if (params.get("clean") === "1") document.body.classList.add("clean");
if (params.get("title")) document.getElementById("title").textContent = params.get("title");
if (params.get("subtitle")) document.getElementById("subtitle").textContent = params.get("subtitle");
const ui = parseFloat(params.get("ui") || "1");
if (ui !== 1) for (const p of document.querySelectorAll(".panel")) p.style.zoom = ui;
document.getElementById("to3d").href = "./" + location.search;

// Memory in GB, and memory per CPU in GB/C; one decimal below 10.
const num = mb => mb >= 10240 ? (mb / 1024).toFixed(0) : (mb / 1024).toFixed(1);
const gb = mb => num(mb) + " GB";
const gbc = mb => num(mb) + " GB/C";
const dur = s => s >= 86400 ? (s / 86400).toFixed(s >= 864000 ? 0 : 1) + " d"
              : s >= 3600 ? (s / 3600).toFixed(s >= 36000 ? 0 : 1) + " h"
              : Math.max(0, Math.round(s / 60)) + " min";
// Two colour scales, switched with C or a click on the legend:
//  fit (default): memory per CPU against the node's, green when equal, blue below,
//  red above (1/4x to 4x); waiting jobs, which have no node yet, are grey;
//  memory per CPU (?color=mpc to start so): 1 GB blue to 32 GB orange, log scale.
let colorMode = params.get("color") === "mpc" ? "mpc" : "fit";
function hueOf(mpc, nodeMpc) {
  if (colorMode === "mpc") {
    const t = Math.max(0, Math.min(1, Math.log2(Math.max(mpc, 1024) / 1024) / 5));
    return 205 - 190 * t;
  }
  if (!nodeMpc) return null;
  const t = Math.max(-1, Math.min(1, Math.log2(mpc / nodeMpc) / 2));
  return t >= 0 ? 130 - 125 * t : 130 - 80 * t;
}
const SCALES = {
  mpc: { title: "Memory per CPU of each job (GB/C)", stops: [0, .2, .4, .6, .8, 1].map(t => [1024 * 2 ** (5 * t), 1]),
         ticks: ["1", "2", "4", "8", "16", "32+"] },
  fit: { title: "Job's memory per CPU vs its node's", stops: [-1, -.5, 0, .5, 1].map(t => [2 ** (2 * t), 1]),
         ticks: ["¼×", "½×", "1×", "2×", "4×"] },
};
function drawLegend() {
  const sc = SCALES[colorMode];
  document.getElementById("legend-title").textContent = sc.title;
  document.getElementById("ramp").style.background = "linear-gradient(90deg," +
    sc.stops.map(([m, n]) => `hsl(${hueOf(m, n)}, 62%, 52%)`).join(",") + ")";
  document.getElementById("ticks").innerHTML = sc.ticks.map(t => `<span>${t}</span>`).join("");
}
function switchScale() {
  colorMode = colorMode === "mpc" ? "fit" : "mpc"; drawLegend(); recolor();
  if (typeof renderOptions === "function") renderOptions();
}
document.getElementById("legend").addEventListener("click", switchScale);
addEventListener("keydown", e => { if (e.key === "c" || e.key === "C") switchScale(); });
// Jobs waiting for one node: drawn at that node, or in the queue like any other
// (P, or ?pinned=queue to start so). The choice is remembered in this browser.
let pinAtNode = params.get("pinned") !== "queue";
try {
  const v = localStorage.getItem("sjp-pinned");
  if (v !== null && !params.has("pinned")) pinAtNode = v === "node";
} catch (e) { /* no storage: the default */ }
function togglePinned() {
  pinAtNode = !pinAtNode;
  try { localStorage.setItem("sjp-pinned", pinAtNode ? "node" : "queue"); } catch (e) { /* fine */ }
  renderOptions();
  if (state) apply(state);
}
addEventListener("keydown", e => { if (e.key === "p" || e.key === "P") togglePinned(); });
// More toggles, remembered the same way: B colours nodes by how busy they are
// (?busy=1), A shows every waiting job instead of the top 50 (?waiting=all).
const remembered = (key, param, on, dflt) => {
  if (params.has(param)) return params.get(param) === on;
  try { const v = localStorage.getItem("sjp-" + key); return v === null ? dflt : v === "1"; }
  catch (e) { return dflt; }
};
const remember = (key, v) => { try { localStorage.setItem("sjp-" + key, v ? "1" : "0"); } catch (e) { /* fine */ } };
let busyMode = remembered("busy", "busy", "1", true);
let allWaiting = remembered("all", "waiting", "all", false);
document.body.classList.toggle("busy", busyMode);
function toggleBusy() { busyMode = !busyMode; remember("busy", busyMode); document.body.classList.toggle("busy", busyMode); renderOptions(); }
function toggleAll() { allWaiting = !allWaiting; remember("all", allWaiting); renderOptions(); if (state) apply(state); }
addEventListener("keydown", e => {
  if (e.key === "b" || e.key === "B") toggleBusy();
  if (e.key === "a" || e.key === "A") toggleAll();
});
// Busyness: blue when idle, yellow at half, red with every CPU allocated. A
// node that takes no jobs is red too, with its reason in the middle.
const busyHue = f => f < 0.5 ? 215 - 165 * f / 0.5 : 50 - 50 * (f - 0.5) / 0.5;
const busyColor = f => `hsl(${busyHue(Math.min(1, Math.max(0, f)))}, 80%, 55%)`;
const busyText = f => `hsl(${busyHue(Math.min(1, Math.max(0, f)))}, 85%, 66%)`;   // readable on the dark card
document.getElementById("busy-ramp").style.background = "linear-gradient(90deg," +
  [0, 0.25, 0.5, 0.75, 1].map(busyColor).join(",") + ")";
// The top 50 (state.top) of the queue and the top 10 waiting at each node, or all (a).
const cap = s => allWaiting ? Infinity : (s.top || 50);
const PER_NODE = 10;
// squeue's order, for the queue when it holds pinned jobs too: priority, then job ID.
const byQueue = (a, b) => (b.priority || 0) - (a.priority || 0)
  || (parseInt(a.id) || 0) - (parseInt(b.id) || 0) || String(a.id).localeCompare(String(b.id));

drawLegend();
const nodeMpc = {};                // node name -> its memory per CPU
function color(job, a = 1) {
  const h = hueOf(job.mem / Math.max(job.cpus, 1e-9), job.node && nodeMpc[job.node]);
  return h === null ? `hsla(0, 0%, 45%, ${a})` : `hsla(${h}, 62%, 52%, ${a})`;
}
function recolor() {}                 // 2D colours are computed while drawing

// ------------------------------------------------------------------ canvas
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  layoutKey = "";
  if (state) apply(state);
}
addEventListener("resize", resize);

// ------------------------------------------------------------------ layout
// Wide screens: the queue in a column on the left, under the title; the nodes
// on the right, one row each. Tall screens: the queue on top, nodes below.
let layoutKey = "", L = null;
const panelBox = id => {          // in page coordinates, whatever the scroll
  const r = document.getElementById(id).getBoundingClientRect();
  return { top: r.top + scrollY, bottom: r.bottom + scrollY, right: r.right, height: r.height };
};
let CH = 0;                       // the canvas height: the page scrolls when it is taller

function layout(nodes) {
  const key = W + "x" + H + ":" + pinAtNode + ":" + nodes.map(n => n.name).join();
  if (key === layoutKey) return;
  layoutKey = key;
  const tall = W / H < 0.9, head = panelBox("head");
  const k = Math.max(1, ui * 0.8), pad = 20 * k, font = 13 * Math.max(1, ui * 0.75);
  const groupH = font * 2.6;
  // Each node is a card: name on top, then its CPU bar, the bands, its memory bar.
  const cardPad = 10 * k, cardGap = 14 * k, barH = (tall ? 30 : 22) * k, bandH = (tall ? 30 : 22) * k;
  const label = font * 1.7, cardH = cardPad + barH + bandH + barH + cardPad;   // name above the card
  // Nodes grouped by partition, highest PriorityTier first; every row the same height.
  const groups = new Map();
  [...nodes].sort((a, b) => b.tier - a.tier || a.name.localeCompare(b.name, undefined, { numeric: true }))
    .forEach(n => { const g = n.partitions.join(","); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n); });
  let queue, x, y, w;
  if (tall) {
    const qTop = head.bottom + pad, qH = Math.min(H * 0.17, 260 * ui);
    queue = { x: pad, y: qTop + font * 1.8, w: W - 2 * pad, h: qH };
    x = pad; y = qTop + qH + font * 2; w = W - 2 * pad;
  } else {
    const qW = Math.max(head.right - pad, 300);
    queue = { x: pad, y: head.bottom + pad + font * 1.8, w: qW, h: H - head.bottom - 3 * pad - font * 1.8 - 90 };
    x = pad * 2 + qW + 20; y = pad; w = W - (pad * 3 + qW + 20);
  }
  // Room for what is free left of the bars, and used / total right of them.
  g.font = `400 ${font * 0.95}px system-ui`;
  const widest = f => Math.max(...nodes.map(n => g.measureText(f(n)).width), 0) + 10;
  const freeW = widest(n => `${gb(n.mem)} free`), usedW = widest(n => `${gb(n.mem)} / ${gb(n.mem)}`);
  // Right of each card, the jobs waiting for that node (pinned); none on narrow screens.
  const pinW = tall || !pinAtNode ? 0 : Math.min(190 * k, w * 0.2), pinGap = pinW ? 10 * k : 0, cw = w - pinW - pinGap;
  const rows = new Map(), heads = [];
  for (const [part, ns] of groups) {
    heads.push({ text: part, x, y: y + groupH * 0.55 }); y += groupH;
    for (const n of ns) {
      const cy = y + label, top = cy + cardPad, bx = x + cardPad + freeW;
      rows.set(n.name, { node: n, x: bx, w: cw - freeW - usedW - 2 * cardPad, label: y,
        cpuY: top, gapY: top + barH, memY: top + barH + bandH, barH,
        card: { x, y: cy, w: cw, h: cardH },
        pin: pinW ? { x: x + cw + pinGap, y: cy, w: pinW, h: cardH } : null });
      y += label + cardH + cardGap;
    }
  }
  CH = Math.max(H, y + pad + (tall ? 110 * ui : 0));
  const nodesH = CH;
  cv.width = W * dpr; cv.height = CH * dpr; cv.style.width = W + "px"; cv.style.height = CH + "px";
  L = { tall, queue, rows, heads, font, nodesH };
}

// ------------------------------------------------------------------ jobs
// Every job is drawn from a few animated numbers: its CPU segment (x, w), its
// memory segment (x, w) and the bars' y. Queued jobs are chips; when a job
// starts, its chip flies into its node and splits into the two segments.
const views = new Map();
function lerp(a, b, k) { return a + (b - a) * k; }

function target(v, t) { v.t = t; if (!v.c) v.c = { ...t }; }

let state = null;
function apply(s) {
  state = s;
  fillFilters(s);
  for (const n of s.nodes) nodeMpc[n.name] = n.mem / n.cpus;
  if (!W) resize();
  layout(s.nodes);
  const seen = new Set();
  const byNode = new Map();
  for (const j of s.running) { if (!byNode.has(j.node)) byNode.set(j.node, []); byNode.get(j.node).push(j); }
  const fresh = new Map(s.nodes.map(n => [n.name, n]));
  for (const [name, r] of L.rows) {
    if (fresh.has(name)) r.node = fresh.get(name);   // its state can change, its place not
    const n = r.node;
    // Jobs in order, those of a reservation last and together, next to the
    // reservation's unused cores: the reservation is one block on the CPU bar.
    const held = (n.resv || []).filter(v => v.active).map(v => v.name);
    const group = j => j.reservation ? 1 + Math.max(held.indexOf(j.reservation), 0) : 0;
    const js = (byNode.get(name) || []).sort((a, b) => group(a) - group(b)
      || (+a.id || 0) - (+b.id || 0) || String(a.id).localeCompare(String(b.id)));
    let cx = 0, cm = 0;
    const block = {};                  // reservation -> [first CPU of its jobs, their CPUs]
    for (const j of js) {
      if (j.reservation) {
        const b = block[j.reservation] || (block[j.reservation] = [cx, 0]);
        b[1] += j.cpus;
      }
      const key = "r:" + j.id + "@" + name; seen.add(key);
      let v = views.get(key);
      const t = { cx: r.x + r.w * cx / n.cpus, cw: r.w * j.cpus / n.cpus,
                  mx: r.x + r.w * cm / n.mem, mw: r.w * j.mem / n.mem,
                  cy: r.cpuY, my: r.memY, h: r.barH, a: 1 };
      if (!v) {
        v = { key, job: j, a: 0 };
        const q = views.get("q:" + j.id);
        if (q && q.c) {                            // fly in from the queue
          v.c = { cx: q.c.cx, cw: q.c.cw, mx: q.c.cx, mw: q.c.cw, cy: q.c.cy, my: q.c.cy, h: q.c.h, a: 1 };
          q.dead = true; q.instant = true;
        } else v.c = { ...t, cy: t.cy - 30, my: t.my - 30, a: 0 };
        views.set(key, v);
      }
      v.job = j; v.dying = false; target(v, t);
      cx += j.cpus; cm += j.mem;
    }
    r.used = [cx, cm];
    r.blocks = block;
  }
  // The queue: chips as wide as their CPUs (on the scale of the biggest node),
  // highest priority first, flowing in rows.
  const maxCpus = Math.max(...s.nodes.map(n => n.cpus), 1), Q = L.queue;
  const unit = Math.min(Q.w / maxCpus * 1.6, 9 * Math.max(1, ui * 0.8));
  const chipH = L.font * 2.3, gap = 6;
  const chip = (j, t) => {
    const key = "q:" + j.id; seen.add(key);
    let v = views.get(key);
    if (!v) { v = { key, job: j, a: 0 }; v.c = { ...t, cy: t.cy - 20, my: t.my - 20, a: 0 }; views.set(key, v); }
    v.job = j; target(v, t);
  };
  // Jobs waiting for one node: in that node's column, as wide as their share of
  // its CPUs, two rows; the column's heading counts all that wait there.
  // The top 50 of these and of the queue, or all (A).
  const at = new Map(), order = [...s.pending].sort(byQueue);
  for (const r of L.rows.values()) r.pinTotal = r.pinCount = 0;
  for (const j of order) {
    const r = j.pinned && L.rows.get(j.pinned);
    if (!r || !r.pin || !matches(j)) continue;
    r.pinTotal++;
    if (!allWaiting && r.pinTotal > PER_NODE) continue;     // beyond its top 10
    const P = r.pin, ph = (P.h - 3 * gap) / 2;
    const p = at.get(j.pinned) || { x: P.x + gap, y: P.y + gap };
    const w = Math.min(Math.max(P.w * j.cpus / r.node.cpus, L.font * 2.6), P.w - 2 * gap);
    if (p.x + w > P.x + P.w - gap && p.x > P.x + gap) { p.x = P.x + gap; p.y += ph + gap; }
    if (p.y + ph > P.y + P.h) continue;
    chip(j, { cx: p.x, cw: w, mx: p.x, mw: w, cy: p.y, my: p.y, h: ph, a: 1 });
    p.x += w + gap; at.set(j.pinned, p); r.pinCount++;
  }
  let qx = Q.x, qy = Q.y, nq = 0;
  L.queued = 0;
  for (const j of order) {
    if (j.pinned && L.rows.has(j.pinned) && L.rows.get(j.pinned).pin) continue;   // at its node
    if (!matches(j)) continue;                                                     // filtered out
    if (++nq > cap(s)) break;
    const w = Math.max(j.cpus * unit, L.font * 3.2);
    if (qx + w > Q.x + Q.w && qx > Q.x) { qx = Q.x; qy += chipH + gap; }
    if (qy + chipH > Q.y + Q.h && !allWaiting) break;   // all (A): the page grows instead
    chip(j, { cx: qx, cw: w, mx: qx, mw: w, cy: qy, my: qy, h: chipH, a: 1 });
    qx += w + gap; L.queued++;
  }
  // All waiting jobs may need a longer page than the nodes do.
  const need = Math.max(L.nodesH, allWaiting ? qy + chipH + 40 : 0);
  if (need !== CH) {
    CH = need;
    cv.height = CH * dpr; cv.style.height = CH + "px";
  }
  for (const [k, v] of views) if (!seen.has(k)) v.dead = true;
  updatePanel(s);
}

function updatePanel(s) {
  if (s.version) document.getElementById("version").textContent = "v" + s.version;
  const cap = s.nodes.reduce((a, n) => [a[0] + n.cpus, a[1] + n.mem], [0, 0]);
  const use = s.running.reduce((a, j) => [a[0] + j.cpus, a[1] + j.mem], [0, 0]);
  const pc = 100 * use[0] / Math.max(cap[0], 1), pm = 100 * use[1] / Math.max(cap[1], 1);
  document.getElementById("cpubar").style.width = pc + "%";
  document.getElementById("membar").style.width = pm + "%";
  document.getElementById("cpu").textContent = `${Math.round(use[0])} / ${cap[0]} (${pc.toFixed(0)}%)`;
  document.getElementById("mem").textContent = `${gb(use[1])} / ${gb(cap[1])} (${pm.toFixed(0)}%)`;
  document.getElementById("jobs").textContent =
    `${new Set(s.running.map(j => j.id)).size} running · ${s.pending_total} waiting` + filterCount(s);
  const d = new Date(s.now * 1000);
  document.getElementById("clock").textContent = s.mode === "demo"
    ? `demo, ${Math.round(s.speed)}× real time · ${d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}`
    : d.toLocaleTimeString();
  const err = document.getElementById("err");
  err.style.display = s.error ? "block" : "none"; err.textContent = s.error ? "sjp-viz: " + s.error : "";
}

// ------------------------------------------------------------------ drawing
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
// Reservations: purple, striped where they hold free space.
const RESV = "#a371f7";
let stripes = null;
function stripe(x, y, w, h) {
  if (!stripes) {
    const c = document.createElement("canvas"); c.width = c.height = 8;
    const p = c.getContext("2d");
    p.strokeStyle = "rgba(163,113,247,0.75)"; p.lineWidth = 2;
    p.beginPath(); p.moveTo(-2, 10); p.lineTo(10, -2); p.moveTo(-2, 2); p.lineTo(2, -2);
    p.moveTo(6, 10); p.lineTo(10, 6); p.stroke();
    stripes = g.createPattern(c, "repeat");
  }
  g.fillStyle = stripes; g.fillRect(x, y, w, h);
}
// A date and a 24-hour time, with the year only when it is not this year: "Oct 19, 08:00".
const when = t => {
  const d = new Date(t * 1000);
  return d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
    hourCycle: "h23", ...(d.getFullYear() !== new Date().getFullYear() && { year: "numeric" }) });
};
// "Oct 19, 08:00 – Oct 21, 08:00 (2.0 d)"; the end as a time only on the same day
const span = r => {
  const a = new Date(r.start * 1000), b = new Date(r.end * 1000);
  const end = a.toDateString() === b.toDateString()
    ? b.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : when(r.end);
  return `${when(r.start)} – ${end} (${dur(r.end - r.start)})`;
};
// "reserved: name (32 CPUs), <span> · name, <span>": those in effect first, then by start.
function resvText(n) {
  const rs = [...(n.resv || [])].sort((a, b) => b.active - a.active || a.start - b.start);
  if (!rs.length) return "";
  return "reserved: " + rs.map(r => `${r.name}${r.whole ? "" : ` (${r.cpus} CPUs)`}, ${span(r)}`)
    .join(" · ");
}

function text(s, x, y, size, weight = 400, fill = "#e6edf3", align = "left") {
  g.font = `${weight} ${size}px system-ui, -apple-system, sans-serif`;
  g.fillStyle = fill; g.textAlign = align; g.textBaseline = "middle"; g.fillText(s, x, y);
}

function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0d1117"; g.fillRect(0, 0, W, CH);
  if (!L || !state) return;
  const f = L.font;
  // The queue's heading.
  // The queue: jobs not waiting for one node; those are at their node.
  const atNode = j => j.pinned && L.rows.has(j.pinned) && L.rows.get(j.pinned).pin;
  const queueTotal = filtering() ? state.pending.filter(j => !atNode(j) && matches(j)).length
    : state.pending.some(atNode) ? (state.queued_total ?? state.pending_total) : state.pending_total;
  if (L.queued) text(allWaiting && L.queued >= queueTotal ? `Waiting (all ${queueTotal})`
      : queueTotal > L.queued ? `Waiting (top ${L.queued} by priority)` : "Waiting",
    L.queue.x, L.queue.y - f * 0.9, f * 1.05, 650);
  for (const h of L.heads) text(h.text, h.x, h.y, f * 1.25, 650, "#8b949e");
  // Each node's column of jobs waiting for it, when it has any.
  for (const r of L.rows.values()) {
    if (!r.pin || !r.pinTotal) continue;
    text(`waiting here: ${r.pinTotal}`, r.pin.x + 2, r.label + f * 0.7, f * 0.85, 500,
         "#8b949e");
    g.strokeStyle = "#30363d"; g.lineWidth = 1; g.setLineDash([4, 4]);
    roundRect(r.pin.x, r.pin.y, r.pin.w, r.pin.h, 8); g.stroke(); g.setLineDash([]);
  }
  // Each node: name, two empty bars, the free space at their ends; free
  // amounts on the left, used / total on the right.
  for (const r of L.rows.values()) {
    const n = r.node, c = r.card;
    g.fillStyle = "#11161d"; roundRect(c.x, c.y, c.w, c.h, 8); g.fill();
    // red: takes no jobs; B: by how busy it is (gold: every CPU allocated)
    const busy = busyMode && n.up ? busyColor((r.used || [0])[0] / n.cpus) : null;
    g.strokeStyle = !n.up ? "#f85149" : busy || "#30363d"; g.lineWidth = !n.up || busy ? 2 : 1; g.stroke();
    text(n.name, c.x + 2, r.label + f * 0.7, f * 1.05, 650);
    g.font = `650 ${f * 1.05}px system-ui`; const nw = g.measureText(n.name).width;
    // After the name: its size; why it takes no jobs (DOWN, DRAIN, ...); its reservations.
    let hx = c.x + 2 + nw + 10;
    for (const [t, colour, weight] of [
      [`${n.cpus} CPUs · ${gb(n.mem)} · ${gbc(n.mem / n.cpus)}`, "#8b949e", 400],
      [n.up ? "" : (n.why || n.state || "down"), "#f85149", 650],
      [resvText(n), RESV, 600]]) {
      if (!t) continue;
      g.font = `${weight} ${f * 0.9}px system-ui`;
      let fit = t;                   // cut at the card's edge
      while (fit.length > 1 && g.measureText(fit).width > c.x + c.w - hx) fit = fit.slice(0, -2) + "…";
      text(fit, hx, r.label + f * 0.7, f * 0.9, weight, colour);
      hx += g.measureText(fit).width + 12;
    }
    const used = r.used || [0, 0];
    const fc = Math.max(0, n.cpus - used[0]), fm = Math.max(0, n.mem - used[1]);
    for (const [y, free, use] of [[r.cpuY, `${Math.round(fc)} free`, `${Math.round(used[0])} / ${n.cpus}`],
                                  [r.memY, `${gb(fm)} free`, `${gb(used[1])} / ${gb(n.mem)}`]]) {
      g.fillStyle = "#161b22"; roundRect(r.x, y, r.w, r.barH, 4); g.fill();
      g.strokeStyle = "#30363d"; g.lineWidth = 1; g.stroke();
      if (n.up) text(free, r.x - 10, y + r.barH / 2, f * 0.95, 500, "#3fb950", "right");
      // used / total, coloured by how much of it is used (b)
      const frac = y === r.cpuY ? used[0] / n.cpus : used[1] / n.mem;
      text(use, r.x + r.w + 10, y + r.barH / 2, f * 0.95, busyMode && n.up ? 600 : 400,
           busyMode && n.up ? busyText(frac) : "#8b949e");
    }
    const fx = r.x + r.w * used[0] / n.cpus, fmx = r.x + r.w * used[1] / n.mem;
    if (!n.up) {                     // takes no jobs: why, in the middle; no room to show
      const mid = c.y + c.h / 2;
      text(n.why || n.state || "down", r.x + r.w / 2, mid - (n.reason ? f * 0.7 : 0), f * 1.3, 700,
           "#f85149", "center");
      if (n.reason) text(n.reason, r.x + r.w / 2, mid + f * 0.8, f, 500, "#e6edf3", "center");
      r.spans = [];
      continue;
    }
    g.fillStyle = "rgba(63,185,80,0.16)";
    g.fillRect(fx, r.cpuY, r.x + r.w - fx, r.barH); g.fillRect(fmx, r.memY, r.x + r.w - fmx, r.barH);
    // Cores a reservation holds unused, striped, after its jobs; for a whole node
    // its free memory too. (Memory cannot be reserved on its own.)
    r.spans = [];
    let sx = used[0];
    for (const v of (n.resv || []).filter(v => v.active)) {
      const [x0, inUse] = (r.blocks || {})[v.name] || [sx, 0];
      const hc = Math.max(0, Math.min(v.left, n.cpus - sx));
      if (hc > 0) stripe(r.x + r.w * sx / n.cpus, r.cpuY, r.w * hc / n.cpus, r.barH);
      // one outline when its jobs end where its unused cores begin, else two
      r.spans.push(...(x0 + inUse === sx ? [[x0, inUse + hc, v]] : [[x0, inUse, v], [sx, hc, v]]));
      sx += hc;
      if (v.whole && fm > 0) stripe(fmx, r.memY, r.x + r.w - fmx, r.barH);
    }
    // Between the bars: the free space's memory per CPU. When one runs out
    // first, the rest of the other is stranded until something ends.
    const freeTxt = fc < 1 && fm < 1024 ? "full" : fc < 1 ? "CPUs full"
      : fm < 1024 ? "memory full" : `${gbc(fm / fc)} free`;
    text(freeTxt, r.x + r.w, r.gapY + (r.memY - r.gapY) / 2, f * 0.85, 500, "#3fb950", "right");
  }
  // Jobs: the band between the bars first, then the two segments, then labels.
  const live = [...views.values()];
  for (const v of live) {
    const c = v.c, mpc = v.job.mem / Math.max(v.job.cpus, 1e-9);
    if (!v.key.startsWith("r:") || c.a <= 0.01) continue;
    g.fillStyle = color(v.job, 0.28 * c.a * (matches(v.job) ? 1 : 0.15));
    g.beginPath(); g.moveTo(c.cx, c.cy + c.h); g.lineTo(c.cx + c.cw, c.cy + c.h);
    g.lineTo(c.mx + c.mw, c.my); g.lineTo(c.mx, c.my); g.closePath(); g.fill();
  }
  for (const v of live) {
    const c = v.c, j = v.job, mpc = j.mem / Math.max(j.cpus, 1e-9);
    if (c.a <= 0.01) continue;
    g.globalAlpha = c.a * (matches(j) ? 1 : 0.15);   // another user's job, while filtering
    const sel = selected === v;
    for (const [x, w, y] of v.key.startsWith("r:") ? [[c.cx, c.cw, c.cy], [c.mx, c.mw, c.my]] : [[c.cx, c.cw, c.cy]]) {
      g.fillStyle = color(j); roundRect(x + 0.5, y, Math.max(w - 1, 0.8), c.h, 3); g.fill();
      g.strokeStyle = sel ? "#ffffff" : "rgba(13,17,23,0.7)"; g.lineWidth = sel ? 2 : 1; g.stroke();
    }
    // Job id and memory per CPU, on the CPU segment (or chip) if there is room.
    if (showLabels) {
      const both = `${j.id} · ${gbc(mpc)}`;
      g.font = `600 ${f * 0.9}px system-ui`;
      if (g.measureText(both).width + 8 < c.cw) text(both, c.cx + c.cw / 2, c.cy + c.h / 2, f * 0.9, 600, "rgba(255,255,255,0.95)", "center");
      else if (g.measureText(j.id).width + 6 < c.cw) {
        g.font = `500 ${f * 0.75}px system-ui`;
        const two = c.h > f * 2 && g.measureText(gbc(mpc)).width + 6 < c.cw;   // room for GB/C below
        text(j.id, c.cx + c.cw / 2, c.cy + c.h / 2 - (two ? f * 0.45 : 0), f * 0.85, 650, "rgba(255,255,255,0.95)", "center");
        if (two) text(`${gbc(mpc)}`, c.cx + c.cw / 2, c.cy + c.h / 2 + f * 0.5, f * 0.75, 500, "rgba(255,255,255,0.8)", "center");
      }
    }
    g.globalAlpha = 1;
  }
  // Each reservation in effect: one outline around its jobs and its unused cores
  // (white when selected).
  for (const r of L.rows.values()) {
    for (const [x0, w, v] of r.spans || []) {
      if (w <= 0) continue;
      const sel = selected && selected.resv && selected.resv.name === v.name && selected.node === r.node.name;
      g.strokeStyle = sel ? "#ffffff" : RESV; g.lineWidth = 2;
      g.strokeRect(r.x + r.w * x0 / r.node.cpus + 1, r.cpuY + 1, r.w * w / r.node.cpus - 2, r.barH - 2);
    }
  }
}

// ------------------------------------------------------------------ animation
let showLabels = params.get("labels") === "1";   // off unless ?labels=1; L toggles
function step(dt) {
  const k = 1 - Math.exp(-dt * 6);
  for (const [key, v] of views) {
    if (v.dead) {
      v.c.a -= v.instant ? 1 : dt * 2.5;
      if (v.c.a <= 0) { if (selected === v) select(null); views.delete(key); continue; }
    } else v.t.a = 1;
    for (const p of ["cx", "cw", "mx", "mw", "cy", "my", "h"]) v.c[p] = lerp(v.c[p], v.t[p], k);
    if (!v.dead) v.c.a = Math.min(1, v.c.a + dt * 3);
  }
}
let last = performance.now();
function frame(now) {
  step(Math.min((now - last) / 1000, 0.1)); last = now; draw(); requestAnimationFrame(frame);
}

async function poll() {
  try { apply(await (await fetch("state.json", { cache: "no-store" })).json()); }
  catch (e) { const err = document.getElementById("err");
    err.style.display = "block"; err.textContent = "No connection to sjp-viz: " + e.message; }
  setTimeout(poll, (state && state.poll_ms) || 3000);
}

// ------------------------------------------------------------------ picking
let selected = null;
cv.addEventListener("click", e => {
  const x = e.offsetX, y = e.offsetY;          // canvas coordinates, scroll included
  let hit = null;
  for (const v of views.values()) {
    if (v.dead) continue;
    const c = v.c, inBox = (bx, bw, by) => x >= bx && x <= bx + bw && y >= by && y <= by + c.h;
    if (inBox(c.cx, c.cw, c.cy) || (v.key.startsWith("r:") && inBox(c.mx, c.mw, c.my))) hit = v;
  }
  // Not a job: a reservation's unused cores?
  if (!hit) for (const r of L.rows.values()) {
    if (y < r.cpuY || y > r.cpuY + r.barH) continue;
    for (const [x0, w, v] of r.spans || []) {
      const bx = r.x + r.w * x0 / r.node.cpus;
      if (w > 0 && x >= bx && x <= bx + r.w * w / r.node.cpus) hit = { resv: v, node: r.node.name };
    }
  }
  select(hit);
});
// The details of a job's reservation, from the link in the job's details.
document.getElementById("info-body").addEventListener("click", e => {
  const a = e.target.closest("a[data-resv]");
  if (!a) return;
  e.preventDefault();
  const n = state.nodes.find(n => n.name === a.dataset.node);
  const v = n && (n.resv || []).find(v => v.name === a.dataset.resv);
  if (v) select({ resv: v, node: n.name });
});
document.getElementById("close").onclick = () => select(null);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function show(title, rows) {
  document.getElementById("info-title").textContent = title;
  document.getElementById("info-body").innerHTML = rows.map(([k, val, html]) =>
    `<tr><td>${k}</td><td>${html || esc(val).replace(/\n/g, "<br>")}</td></tr>`).join("");
  document.getElementById("info").style.display = "block";
}
// A reservation on one node: what it holds there, its own jobs' use, when, and for whom.
function showResv(v, node) {
  show(`Reservation ${v.name}`, [
    ["Node", node + (v.nodes > 1 ? ` (and ${v.nodes - 1} more)` : "")],
    ["CPUs", v.whole ? `${v.cpus} (the whole node)` : v.cpus],
    ...(v.active ? [["In use", `${v.cpus - v.left} by its jobs, ${v.left} unused`]] : []),
    ["When", span(v)],
    ["State", v.active ? `in effect, ${dur(v.end - state.now)} left` : `starts in ${dur(v.start - state.now)}`],
    ...[["Users", v.users], ["Accounts", v.accounts], ["Partition", v.partition], ["Flags", v.flags]]
      .filter(([, x]) => x).map(([k, x]) => [k, x.split(",").join("\n")]),
  ]);
}

function select(v) {
  selected = v;
  const box = document.getElementById("info");
  if (!v) { box.style.display = "none"; return; }
  if (v.resv) { showResv(v.resv, v.node); return; }
  const j = v.job, mpc = j.mem / Math.max(j.cpus, 1e-9), running = v.key.startsWith("r:");
  const rows = [
    ["User", j.user], ["Name", j.name],
    ["State", running ? `running on ${j.node}` + (j.nodes > 1 ? ` (+${j.nodes - 1} nodes)` : "")
                     : j.pinned ? `waiting for ${j.pinned} (${j.reason})` : `waiting (${j.reason})`],
    ["CPUs", (+j.cpus).toFixed(j.cpus % 1 ? 1 : 0)], ["Memory", gb(j.mem)], ["Memory / CPU", gbc(mpc)],
    running ? ["Time", `${dur(state.now - j.end + j.minutes * 60)} of ${dur(j.minutes * 60)}, ${dur(j.end - state.now)} left`]
            : ["Time limit", dur(j.minutes * 60)],
    ...(running ? [] : [["Priority", j.priority == null ? "–" : Math.round(j.priority)]]),
    ["Partition", j.partition || "–"], ["QOS", j.qos],
    ...(j.reservation ? [["Reservation", j.reservation, running
      ? `<a href="#" data-resv="${esc(j.reservation)}" data-node="${esc(j.node)}">${esc(j.reservation)}</a>`
      : ""]] : []),
    // what sjp did with it, from its AdminComment: one mark per line
    ...(j.sjp ? [["sjp", j.sjp.replace(/^sjp:/, "").split(";").join("\n")]] : []),
  ];
  show(`Job ${j.id}`, rows);
}
addEventListener("keydown", e => {
  if (e.key === "l" || e.key === "L") showLabels = !showLabels;
  if (e.key === "h" || e.key === "H") document.body.classList.toggle("bare");
  if (e.key === "?") toggleOptions();
  renderOptions();
});
// ------------------------------------------------------------------ filter
// Show one user's or one account's jobs: the others' running jobs fade and the
// queue holds only theirs. Kept in the URL (?user=, ?account=), so a link shows
// the same.
let fUser = params.get("user") || "", fAcct = params.get("account") || "";
const matches = j => (!fUser || j.user === fUser) && (!fAcct || j.account === fAcct);
const filtering = () => !!(fUser || fAcct);
const escH = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function fillSelect(id, all, items, cur) {
  if (cur && !items.includes(cur)) items = [...items, cur];
  const el = document.getElementById(id), key = items.join("\n") + "|" + cur;
  if (el.dataset.k === key) return;
  el.dataset.k = key;
  el.innerHTML = `<option value="">${all}</option>` + items.map(x =>
    `<option value="${escH(x)}"${x === cur ? " selected" : ""}>${escH(x)}</option>`).join("");
}
// Users with a job running or waiting; every account in the Slurm database.
function fillFilters(s) {
  const jobs = [...s.running, ...s.pending];
  fillSelect("f-user", "all users", [...new Set(jobs.map(j => j.user))].sort(), fUser);
  fillSelect("f-account", "all accounts",
    [...new Set([...(s.accounts || []), ...jobs.map(j => j.account).filter(Boolean)])].sort(), fAcct);
}
for (const [id, set] of [["f-user", v => { fUser = v; }], ["f-account", v => { fAcct = v; }]]) {
  document.getElementById(id).addEventListener("change", e => {
    set(e.target.value);
    const u = new URL(location);
    for (const [k, v] of [["user", fUser], ["account", fAcct]]) v ? u.searchParams.set(k, v) : u.searchParams.delete(k);
    history.replaceState(null, "", u);
    e.target.blur();
    if (state) apply(state);
  });
}
// Keys typed in a dropdown pick its options; they are not shortcuts.
addEventListener("keydown", e => { if (e.target.closest && e.target.closest("select")) e.stopImmediatePropagation(); }, true);
// "· theirs: 3 running, 1 waiting", when filtering.
function filterCount(s) {
  if (!filtering()) return "";
  const r = new Set(s.running.filter(matches).map(j => j.id)).size, w = s.pending.filter(matches).length;
  return ` · shown: ${r} running, ${w} waiting`;
}

// The options: a switch for each setting, which is also its key; and how to
// move around. Open or closed is remembered.
function optionRows() {
  return [
    { key: "b", text: "colour nodes by how busy they are", get: () => busyMode, toggle: toggleBusy },
    { key: "c", text: "colour jobs by memory per CPU (else fit)", get: () => colorMode === "mpc", toggle: switchScale },
    { key: "p", text: "jobs waiting for one node at that node", get: () => pinAtNode, toggle: togglePinned },
    { key: "a", text: "all waiting jobs (else top 50, 10 per node)", get: () => allWaiting, toggle: toggleAll },
    { key: "l", text: "job labels", get: () => showLabels, toggle: () => { showLabels = !showLabels; } },
    { key: "click", text: "a job's or a reservation's details" },
    { key: "h", text: "hide the panels" }, { key: "?", text: "open or close these options" }];
}
function renderOptions() {
  document.getElementById("keys").innerHTML = optionRows().map((r, i) => r.get
    ? `<tr class="opt" data-i="${i}"><td><span class="sw${r.get() ? " on" : ""}"></span>${r.text}</td><td class="k">${r.key}</td></tr>`
    : `<tr class="how"><td>${r.text}</td><td class="k">${r.key}</td></tr>`).join("");
}
document.getElementById("keys").addEventListener("click", e => {
  const tr = e.target.closest("tr.opt");
  if (tr) { optionRows()[+tr.dataset.i].toggle(); renderOptions(); }
});
function toggleOptions() {
  document.body.classList.toggle("keys"); remember("options", document.body.classList.contains("keys"));
}
document.getElementById("opt-head").addEventListener("click", toggleOptions);
document.body.classList.toggle("keys", remembered("options", "options", "1", false));
renderOptions();

// ?manual=1: no polling and no clock; a recorder feeds states and steps frames.
resize();
const manual = params.get("manual") === "1";
if (!manual) { poll(); requestAnimationFrame(frame); }
window.sjpViz = { apply, views, frame(dt) { step(dt); draw(); }, get state() { return state; } };
</script>
</body>
